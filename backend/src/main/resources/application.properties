# Server
server.port=${SERVER_PORT:8080}

# MongoDB Atlas (Loaded from backend/.env or MONGODB_URI environment variable)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/api_failure_analyzer}

# Application
app.max-upload-size-mb=${MAX_UPLOAD_SIZE_MB:5}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.analysis-version=1.0.0

# File upload limits
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE_MB:5}MB
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE_MB:5}MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.apifailureanalyzer=INFO
